spring:
  application:
    name: machtrip-pipeline
  main:
    banner-mode: off
  config:
    # Filters and the closed tag list live in their own files (config/filters.yml, config/tags.yml);
    # override the directory with --pipeline.config-dir
    import: optional:file:${pipeline.config-dir:config}/filters.yml,optional:file:${pipeline.config-dir:config}/tags.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/machtrip}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # every unqualified table name resolves inside schema "pipeline" only
      schema: pipeline
      maximum-pool-size: 4
  flyway:
    schemas: pipeline
    default-schema: pipeline          # history table lives here, never in public
    table: flyway_schema_history
    create-schemas: true
    locations: classpath:db/migration

server:
  # The web server only starts for `serve-webhook` (see Application.main). Bind to loopback by default;
  # put a tunnel/reverse proxy in front, or set SERVER_ADDRESS=0.0.0.0 deliberately.
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    vn.machtrip: INFO

pipeline:
  config-dir: config
  hash-salt: ${HASH_SALT:}
  raw-store-dir: ${RAW_STORE_DIR:./data/raw}
  apify:
    token: ${APIFY_TOKEN:}
    base-url: https://api.apify.com/v2
    actor-id: clockworks~tiktok-scraper
    max-total-charge-usd: 1.0
    timeout-sec: 600
    wait-for-finish-sec: 60
    page-size: 100
    retry:
      initial-backoff: 500ms
      overall-timeout: 60s
  webhook:
    public-base-url: ${PUBLIC_WEBHOOK_BASE_URL:}
    secret: ${WEBHOOK_SECRET:}
  api:
    # Every request under /api/** must send header 'X-API-Key' equal to this. Blank = API refuses all requests.
    key: ${API_KEY:}
  job:
    max-attempts: 3
    poll-interval: 5s
    lock-timeout: 30m
  reconcile:
    stale-after: 15m
  comments:
    per-video-cap: 50
    total-items-cap: 1000

# Stage 2 (extraction). All LLM calls go through the Genway gateway, never a provider directly.
genway:
  base-url: ${GENWAY_BASE_URL:}
  api-key: ${GENWAY_API_KEY:}
  kong-api-key: ${KONG_API_KEY:}   # key of the Kong gateway in front of Genway, sent as header "apikey"
  read-timeout: 90s
  connect-timeout: 10s
  max-connect-retries: 2     # only connection errors / timeouts; HTTP 429/5xx are never retried (Genway does that)
  initial-backoff: 500ms
  system-prompt-as: message   # message = a role:system chat message, field = input.system (docs/genway-llm-api.md is silent)
  thinking: ${GENWAY_THINKING:}   # disabled|enabled -> input.thinking.type; empty = send nothing (doc lists it only for deepseek-*)

extract:
  # TODO(user): set model to a model_key your Genway tenant may call (text models in the doc: claude-sonnet-5,
  #             deepseek-flash, deepseek-v4-pro, gpt-4o), or pass --model. Left unset on purpose.
  # TODO(user): set pricing in USD per token, e.g. input-per-token: 0.000003. Without it real runs refuse to start,
  #             because the cost cap cannot be enforced.
  # model:
  # pricing:
  #   input-per-token:
  #   output-per-token:
  prompt-version: v1
  max-cost-usd-per-run: 0.50
  max-videos-per-run: 50
  concurrency: 2
  max-comments: 30
  max-comment-chars: 400
  max-transcript-chars: 24000
  chars-per-token: 3
  max-output-tokens: 4096
  structured-output: false   # the Genway doc describes no JSON-schema field, so output is JSON-by-prompt + code validation
